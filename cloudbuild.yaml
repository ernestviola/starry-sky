substitutions:
  _REGION: us-central1
  _INSTANCE_CONNECTION_NAME: pet-projects-461723:us-central1:the-odin-project
  _ARTIFACT_REPOSITORY: starry-sky
  _IMAGE_NAME: starry-sky
  _SERVICE_NAME: starry-sky
  _MIGRATION_JOB: starry-sky-migrate
  _RUNTIME_SERVICE_ACCOUNT: starry-sky-runtime@pet-projects-461723.iam.gserviceaccount.com
  _MIGRATION_SERVICE_ACCOUNT: starry-sky-migrator@pet-projects-461723.iam.gserviceaccount.com
  _DATABASE_URL_SECRET: starry-sky-database-url
  _MIGRATION_DATABASE_URL_SECRET: starry-sky-migration-database-url
  _PASSPORT_SECRET: starry-sky-passport-secret

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - migrator
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA-migrator
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - production
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA-migrator

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA-migrator
      - --region=${_REGION}
      - --service-account=${_MIGRATION_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-secrets=DATABASE_URL=${_MIGRATION_DATABASE_URL_SECRET}:latest
      - --command=node
      - --args=node_modules/prisma/build/index.js,migrate,deploy

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB}
      - --region=${_REGION}
      - --wait

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,PASSPORT_JS_SECRET=${_PASSPORT_SECRET}:latest
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA-migrator
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
